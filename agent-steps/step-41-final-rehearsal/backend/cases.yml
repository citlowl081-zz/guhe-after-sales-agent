# 模型改写后的客服话术不作为事实断言。
# 订单、价格、库存看工具摘要；政策原文看引用片段；流程结论看 trace 与 session_state。
cases:
  - case_id: order-logistics-tool-path
    user_message: 请帮我查一下 SO20260602103000009-a1000009 的物流
    runtime_context:
      currentUserOrders:
        - orderNo: SO20260602103000009-a1000009
          userId: U1001
          fulfillmentStatus: SHIPPED
          logisticsStatus: IN_TRANSIT
          items:
            - productName: 古河智能音箱
    expected_tool_outputs:
      - 物流状态
      - 运输中
    expected_tools:
      - get_order_detail
      - get_order_logistics
    forbidden_tools:
      - retrieve_knowledge
    expected_trace_events:
      - runtime_context_built
      - context_built
      - tool_finished
      - cost_recorded
    expected_session_state:
      - trace.public_trace_only=true
      - model.final_answer.used_model

