    forbidden_answer_claims:
      - label: 不得宣称退款已经发起
        pattern: '(?:已|已经)(?!.{0,8}(?:可以|可|能够|能|具备|指导|告知|提醒|建议|说明|协助您自行|告诉您如何)).{0,8}(?:为您|替您|代您|帮您)?.{0,4}(?:发起|提交|办理|开始处理)(?:了)?退款'

